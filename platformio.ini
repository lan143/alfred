[env:wbmge]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters =
    direct
    colorize
    esp32_exception_decoder
board_build.filesystem = littlefs
board_build.flash_mode = dio
lib_deps =
    ESP32Async/ESPAsyncWebServer@3.10.0
    ArduinoJSON@7.4.3
    FS
    https://github.com/lan143/ed-mqtt#0.1.1
    https://github.com/lan143/ed-config
    https://github.com/lan143/ed-utils
    https://github.com/lan143/ed-ha
    https://github.com/lan143/ed-healthcheck
    https://github.com/lan143/ed-wb#0.1.0
    https://github.com/GyverLibs/GyverFilters#3.2
    https://github.com/lan143/ed-network
    TCA9555@0.4.4
    https://github.com/lan143/ed-common#0.3.0
build_flags=
    -Wshadow
    -DCORE_DEBUG_LEVEL=5
    -DCONFIG_LOG_COLORS=1

[env:wbmge_ota]
extends = env:wbmge
upload_protocol = espota
upload_port = 192.168.1.46
upload_flags = --auth=somestrongpassword 
